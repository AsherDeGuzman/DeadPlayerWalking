<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1720" viewBox="0 0 2000 1720" role="img" aria-labelledby="title description">
  <title id="title">Dead Player Walking — Godot Scene Tree Plan</title>
  <desc id="description">A scene tree diagram of the implemented Godot game, including the saved Main and Level01 scenes and visible player and dungeon-room collision nodes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#17243a"/>
    </linearGradient>
    <linearGradient id="root" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d4aff"/>
      <stop offset="1" stop-color="#a24cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #eef4ff; }
      .title { font-size: 42px; font-weight: 700; letter-spacing: .2px; }
      .subtitle { font-size: 19px; fill: #aab9d2; }
      .section { font-size: 23px; font-weight: 700; }
      .node-title { font-size: 21px; font-weight: 700; }
      .node-type { font-size: 16px; fill: #bac8de; }
      .item { font-size: 17px; fill: #e6edf9; }
      .small { font-size: 15px; fill: #b6c4da; }
      .muted { fill: #9daec9; }
      .connector { fill: none; stroke: #7185a6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .connector-dash { fill: none; stroke: #8497b6; stroke-width: 2.5; stroke-dasharray: 8 9; stroke-linecap: round; }
      .panel { fill: #1d2b42; stroke: #344967; stroke-width: 2; }
      .subpanel { fill: #19263a; stroke: #354b68; stroke-width: 1.5; }
      .chip { fill: #2a3d59; stroke: #456080; stroke-width: 1.3; }
      .runtime { fill: #372d20; stroke: #a78340; stroke-width: 1.5; }
      .autonode { fill: #172f39; stroke: #317b83; stroke-width: 2; }
      .dot { fill: #96a9c5; }
    </style>
  </defs>

  <rect width="2000" height="1720" fill="url(#background)"/>
  <circle cx="1850" cy="90" r="220" fill="#6d4aff" opacity=".055"/>
  <circle cx="105" cy="1610" r="250" fill="#29b4ad" opacity=".045"/>

  <text x="90" y="83" class="title">Dead Player Walking</text>
  <text x="92" y="119" class="subtitle">Godot scene tree plan · reflects the implemented project structure</text>

  <g filter="url(#shadow)">
    <rect x="90" y="156" width="490" height="82" rx="18" class="autonode"/>
    <text x="118" y="191" class="node-title">AudioManager</text>
    <text x="118" y="218" class="node-type">Autoload · global audio service</text>
  </g>
  <path d="M580 197 H690" class="connector-dash"/>
  <text x="608" y="183" class="small">project-wide</text>

  <g filter="url(#shadow)">
    <rect x="745" y="156" width="510" height="88" rx="20" fill="url(#root)"/>
    <text x="1000" y="194" text-anchor="middle" class="node-title" font-size="27">Main</text>
    <text x="1000" y="223" text-anchor="middle" class="node-type" fill="#f2eaff">Control · main scene</text>
  </g>

  <path d="M1000 244 V278 H307 V310 M1000 278 V310 M1000 278 H1692 V310" class="connector"/>
  <g filter="url(#shadow)">
    <rect x="90" y="310" width="435" height="90" rx="16" class="panel"/>
    <text x="118" y="347" class="node-title">RunManager</text>
    <text x="118" y="375" class="node-type">Node · persistent run state and rewards</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="745" y="310" width="510" height="90" rx="16" fill="#25304c" stroke="#8471e6" stroke-width="2.5"/>
    <text x="1000" y="347" text-anchor="middle" class="node-title">Level01</text>
    <text x="1000" y="375" text-anchor="middle" class="node-type">Node2D · saved under Main; visible during a run</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1475" y="310" width="435" height="90" rx="16" class="panel"/>
    <text x="1503" y="347" class="node-title">Screen UI</text>
    <text x="1503" y="375" class="node-type">CanvasLayer · title / workshop / settings</text>
  </g>
  <text x="1475" y="435" class="small">PauseMenu: separate runtime CanvasLayer, also owned by Main.</text>

  <path d="M1000 400 V452" class="connector"/>
  <rect x="65" y="452" width="1870" height="1120" rx="24" fill="#131f31" stroke="#384c69" stroke-width="2"/>
  <text x="100" y="494" class="section">Level01 children</text>
  <text x="1895" y="493" text-anchor="end" class="small">solid outlines = scene nodes · gold outlines = runtime / conditional nodes</text>
  <path d="M1000 400 V530 H340 V575 M1000 530 V575 M1000 530 H1660 V575" class="connector"/>

  <g filter="url(#shadow)">
    <rect x="100" y="575" width="480" height="930" rx="18" class="panel"/>
    <rect x="100" y="575" width="480" height="76" rx="18" fill="#263752"/>
    <path d="M100 635 H580" stroke="#263752" stroke-width="32"/>
    <text x="128" y="612" class="node-title">Rooms</text>
    <text x="128" y="637" class="node-type">Node2D · saved first room and active room</text>
  </g>
  <path d="M340 651 V684" class="connector"/>
  <rect x="125" y="684" width="430" height="773" rx="15" class="subpanel"/>
  <text x="153" y="724" class="node-title">DungeonRoom</text>
  <text x="153" y="751" class="node-type">Node2D · reusable room scene instance</text>

  <path d="M340 766 V786 H177 M340 786 H504 M177 786 V803 M504 786 V803 M177 895 V914 M504 895 V914 M177 1048 V1067 M504 1048 V1067" class="connector"/>
  <rect x="145" y="803" width="395" height="92" rx="13" class="chip"/>
  <text x="166" y="837" class="node-title">WorldGeometry</text>
  <text x="166" y="866" class="item">Boundaries, exit gate + six cover colliders</text>
  <rect x="145" y="914" width="395" height="134" rx="13" class="chip"/>
  <text x="166" y="948" class="node-title">Enemies</text>
  <text x="166" y="977" class="item">Enemies spawn with their collision shapes</text>
  <text x="166" y="1006" class="item">Bosses spawn in boss rooms</text>
  <rect x="145" y="1067" width="395" height="114" rx="13" class="chip"/>
  <text x="166" y="1102" class="node-title">HealingPickup</text>
  <text x="166" y="1132" class="item">Area2D + CollisionShape2D</text>
  <rect x="145" y="1200" width="395" height="92" rx="13" class="chip"/>
  <text x="166" y="1236" class="node-title">ExitTrigger</text>
  <text x="166" y="1265" class="item">Area2D + CollisionShape2D</text>
  <text x="153" y="1340" class="small">All room and player collision nodes are in the saved tree.</text>
  <text x="153" y="1367" class="small">Extra enemies and projectiles spawn at runtime.</text>

  <g filter="url(#shadow)">
    <rect x="760" y="575" width="480" height="930" rx="18" class="panel"/>
    <rect x="760" y="575" width="480" height="76" rx="18" fill="#263752"/>
    <path d="M760 635 H1240" stroke="#263752" stroke-width="32"/>
    <text x="788" y="612" class="node-title">Player</text>
    <text x="788" y="637" class="node-type">CharacterBody2D · player scene</text>
  </g>
  <path d="M1000 651 V684 M1000 728 V753" class="connector"/>
  <rect x="795" y="684" width="410" height="64" rx="13" class="chip"/>
  <text x="1000" y="724" text-anchor="middle" class="node-title">CollisionShape2D</text>

  <rect x="795" y="753" width="410" height="238" rx="14" class="subpanel"/>
  <text x="824" y="792" class="node-title">Visuals and combat</text>
  <circle cx="820" cy="824" r="4" class="dot"/>
  <text x="839" y="830" class="item">AnimatedSprite2D</text>
  <circle cx="820" cy="858" r="4" class="dot"/>
  <text x="839" y="864" class="item">SwordSprite / CrossbowSprite</text>
  <circle cx="820" cy="892" r="4" class="dot"/>
  <text x="839" y="898" class="item">MeleeHitbox + CollisionShape2D</text>
  <circle cx="820" cy="926" r="4" class="dot"/>
  <text x="839" y="932" class="item">SlashEffect / MeleeImpactEffect</text>
  <circle cx="820" cy="960" r="4" class="dot"/>
  <text x="839" y="966" class="item">CrossbowProjectile (runtime)</text>

  <rect x="795" y="1015" width="410" height="140" rx="14" class="chip"/>
  <text x="824" y="1054" class="node-title">Camera2D</text>
  <text x="824" y="1085" class="item">Smooth follow · room framing</text>
  <text x="824" y="1115" class="small">Attached to and follows the player.</text>
  <rect x="795" y="1180" width="410" height="114" rx="14" class="subpanel"/>
  <text x="824" y="1219" class="node-title">Combat setup</text>
  <text x="824" y="1250" class="item">Fixed melee and ranged weapons</text>
  <text x="824" y="1278" class="small">Weapon state is handled by the player.</text>
  <text x="824" y="1367" class="small">Player scene is a direct child of Level01.</text>

  <g filter="url(#shadow)">
    <rect x="1420" y="575" width="480" height="930" rx="18" class="panel"/>
    <rect x="1420" y="575" width="480" height="76" rx="18" fill="#263752"/>
    <path d="M1420 635 H1900" stroke="#263752" stroke-width="32"/>
    <text x="1448" y="612" class="node-title">HUD</text>
    <text x="1448" y="637" class="node-type">CanvasLayer · in-game interface</text>
  </g>
  <path d="M1660 651 V684" class="connector"/>
  <rect x="1455" y="684" width="410" height="64" rx="13" class="chip"/>
  <text x="1660" y="724" text-anchor="middle" class="node-title">Screen · Control</text>

  <path d="M1660 748 V780 H1525 M1660 780 H1795 M1525 780 V800 M1795 780 V800 M1525 889 V910 M1795 889 V910 M1525 999 V1020 M1795 999 V1020 M1525 1109 V1130 M1795 1109 V1130" class="connector"/>
  <rect x="1455" y="800" width="198" height="89" rx="13" class="chip"/>
  <text x="1474" y="835" class="node-title">Health UI</text>
  <text x="1474" y="864" class="small">bar and value</text>
  <rect x="1667" y="800" width="198" height="89" rx="13" class="chip"/>
  <text x="1686" y="835" class="node-title">Floor / Scrap</text>
  <text x="1686" y="864" class="small">run progress</text>
  <rect x="1455" y="910" width="198" height="89" rx="13" class="chip"/>
  <text x="1474" y="945" class="node-title">Weapon UI</text>
  <text x="1474" y="974" class="small">current weapon</text>
  <rect x="1667" y="910" width="198" height="89" rx="13" class="runtime"/>
  <text x="1686" y="945" class="node-title">BossHealth</text>
  <text x="1686" y="974" class="small">shown for boss fights</text>
  <rect x="1455" y="1020" width="198" height="89" rx="13" class="chip"/>
  <text x="1474" y="1055" class="node-title">TouchControls</text>
  <text x="1474" y="1084" class="small">mobile actions</text>
  <rect x="1667" y="1020" width="198" height="89" rx="13" class="runtime"/>
  <text x="1686" y="1055" class="node-title">Floor5Reveal</text>
  <text x="1686" y="1084" class="small">first arrival only</text>
  <rect x="1455" y="1130" width="410" height="89" rx="13" class="chip"/>
  <text x="1474" y="1165" class="node-title">PauseButton</text>
  <text x="1474" y="1194" class="small">opens Main's PauseMenu layer</text>
  <text x="1455" y="1280" class="small">HUD elements are built dynamically by its script.</text>
  <text x="1455" y="1308" class="small">Boss and reveal panels are conditional.</text>

  <rect x="100" y="1600" width="1800" height="64" rx="15" fill="#202c40" stroke="#405570" stroke-width="1.5"/>
  <rect x="128" y="1620" width="18" height="18" rx="4" class="chip"/>
  <text x="158" y="1636" class="small">Authored scene node</text>
  <rect x="370" y="1620" width="18" height="18" rx="4" class="runtime"/>
  <text x="400" y="1636" class="small">Runtime / conditional node</text>
  <text x="1867" y="1636" text-anchor="end" class="small">Scene tree reference for GDD Sections 8.4–8.5</text>
</svg>
